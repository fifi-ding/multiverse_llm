[project]
name = "multiverse-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "pyright",
    "pre-commit",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes (unused imports/vars, undefined names)
    "I",       # isort
    "B",       # bugbear (likely bugs)
    "UP",      # pyupgrade (modern syntax)
    "SIM",     # simplify
    "C4",      # cleaner comprehensions
    "RUF",     # ruff-specific checks
    "PTH",     # prefer pathlib over os.path
    "RET",     # cleaner returns
]
ignore = ["E501"]  # the formatter handles line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["*.py"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
